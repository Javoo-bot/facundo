# Claude Code on GitHub: @claude in an issue or PR comment starts a run on that thread.
# The factory's own jobs (sweep, worker, review) are separate workflows, added in unit 5.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Subscription token from `claude setup-token`; swap for anthropic_api_key to bill the API instead.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Haiku 5.5 by default (cost-first); a task card may raise it with --model for class B and C work.
          claude_args: "--model claude-haiku-5-5 --max-turns 40"
