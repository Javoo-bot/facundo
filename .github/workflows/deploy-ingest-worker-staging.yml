name: Deploy ingest worker STAGING (Cloudflare)

# Deploys `ingest-worker/` --env staging: a second, fully separate worker
# (facundo-ingest-worker-staging, -staging queues/workflows) wired to the
# STAGING Supabase project and the staging dashboard. See the "STAGING" section
# in ingest-worker/wrangler.jsonc for why it exists (the 2026-08-20 A1 final QA
# found staging had no automation brain at all: queued ingest jobs sat forever
# and nothing re-matched escalated orders).
#
# SECRETS. Deploy auth is the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
# pair the production deploys use. The worker's RUNTIME secrets are pushed on
# every deploy from GH Actions secrets (unlike production, where they were set
# once by hand — nobody has run `wrangler login` for staging, so CI is the one
# authenticated place):
#   STAGING_SUPABASE_URL / STAGING_SUPABASE_SERVICE_ROLE_KEY — staging DB
#   STAGING_APIFY_TOKEN / STAGING_OPENROUTER_API_KEY — CityIngestWorkflow legs
#   STAGING_OUTBOX_SECRET — must equal the staging DASHBOARD's OUTBOX_SECRET;
#     this workflow also writes it onto facundo-dashboard-staging so the two
#     can never disagree (NOTE: that rotates the dashboard's previous secret —
#     any external cron pinger still using the old value will 401, which is
#     fine: this worker's own minute cron replaces it).
#   STAGING_SHOPIFY_WEBHOOK_SECRET — staging has no real Shopify store; this
#     lets QA POST simulated, HMAC-signed webhooks at the staging worker to
#     exercise real intake.
# Deliberately NOT set: SHOPIFY_SHOP / SHOPIFY_ADMIN_TOKEN (the reconcile
# sweeps and variant enrichment stay no-ops — staging must never call the real
# Shopify Admin API).

on:
  push:
    branches: [staging]
    paths:
      - "ingest-worker/**"
      - ".github/workflows/deploy-ingest-worker-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ingest-worker-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ingest-worker/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # Queues must exist before a deploy that binds them. Create is not
      # idempotent, so tolerate "already exists" (any other failure still
      # surfaces on the deploy step, which errors on a missing queue).
      - name: Ensure staging queues exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for q in ingest-city-queue-staging ingest-city-dlq-staging orders-queue-staging orders-dlq-staging; do
            npx wrangler queues create "$q" || echo "queue $q: create skipped (already exists?)"
          done

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging

      - name: Push runtime secrets (staging worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put() { printf '%s' "$2" | npx wrangler secret put "$1" --env staging; }
          put SUPABASE_URL              "${{ secrets.STAGING_SUPABASE_URL }}"
          put SUPABASE_SERVICE_ROLE_KEY "${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}"
          put APIFY_TOKEN               "${{ secrets.STAGING_APIFY_TOKEN }}"
          put OPENROUTER_API_KEY        "${{ secrets.STAGING_OPENROUTER_API_KEY }}"
          put OUTBOX_SECRET             "${{ secrets.STAGING_OUTBOX_SECRET }}"
          put SHOPIFY_WEBHOOK_SECRET    "${{ secrets.STAGING_SHOPIFY_WEBHOOK_SECRET }}"

      # Keep the staging DASHBOARD's OUTBOX_SECRET in lockstep so the worker's
      # ticks authenticate (rotates whatever value was there before — see the
      # header note), and give it the Ongage transactional creds so
      # lib/email.ts's daily-quota fallback works on the deployed side too
      # (staging shares one free-tier Resend account; the 2026-08-20 QA hit its
      # daily cap mid-run). STAGING_ONGAGE_* are optional — absent secrets
      # write empty strings, which ongageConfigured() treats as not configured.
      - name: Align staging dashboard secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          putdash() { printf '%s' "$2" | npx wrangler secret put "$1" --name facundo-dashboard-staging; }
          putdash OUTBOX_SECRET                "${{ secrets.STAGING_OUTBOX_SECRET }}"
          # Photo-verify needs this on the DASHBOARD too (lib/photoVerify runs in
          # the florist photo-upload route): without it every provider is disabled,
          # the verdict is `review` @ confidence 0, and the 30% leg always parks
          # as `held` — the 2026-08-20 QA delivered-photo run hit exactly that.
          putdash OPENROUTER_API_KEY           "${{ secrets.STAGING_OPENROUTER_API_KEY }}"
          putdash ONGAGE_USERNAME              "${{ secrets.STAGING_ONGAGE_USERNAME }}"
          putdash ONGAGE_PASSWORD              "${{ secrets.STAGING_ONGAGE_PASSWORD }}"
          putdash ONGAGE_ACCOUNT_CODE          "${{ secrets.STAGING_ONGAGE_ACCOUNT_CODE }}"
          putdash ONGAGE_LIST_ID               "${{ secrets.STAGING_ONGAGE_LIST_ID }}"
          putdash ONGAGE_SENDING_CONNECTION_ID "${{ secrets.STAGING_ONGAGE_SENDING_CONNECTION_ID }}"
          putdash ONGAGE_FROM_ADDRESS          "${{ secrets.STAGING_ONGAGE_FROM_ADDRESS }}"

      - name: Record what shipped
        run: |
          echo "### Staging ingest worker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- message: $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
