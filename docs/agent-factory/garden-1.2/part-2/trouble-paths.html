rd opens","kind":"edge","owner":null,"cases":4},{"id":"needs-person","label":"Mike says it needs a person","kind":"person","owner":null,"cases":1},{"id":"done","label":"Card closed","kind":"ok","owner":null,"cases":4}],"edges":[{"from":"opened","to":"done","count":3},{"from":"opened","to":"needs-person","count":1},{"from":"needs-person","to":"done","count":1}],"hidden":0}},"runCauses":{"designed":11,"crashed":1,"person":3,"test":2},"roots":[{"id":"split","graph":"desk","tone":"crit","owner":"jessica","highlight":[["opened","never"]],"title":"One problem is filed as many cards","why":"Each client email's subject becomes part of the card's name, so every email opens a new card.","seen":"70 of 119 cards share one reason; 70 of them were never worked.","root":"The planner writes the client's email subject into its hand-off reason, and the sweep turns each distinct reason into its own card. Every new email from a client becomes a new card, so the queue fills with copies of one rule: a client wrote in, and a person answers.","evidence":["card key concierge:conversation_escalation:planner:the client wrote about their order:<subject>","origin/garden dashboard/lib/conversations.ts:265","agents/factory/cards.mjs:147 (fingerprint)"],"alone":"Grouping cards is factory code, so the change needs a person (the doctor lane). Once it lands, closing the duplicate cards is a call an agent can make alone and log."},{"id":"designed","graph":"both","tone":"warn","owner":"donna","highlight":[["hand-off","rule-gap"],["money-held","rule-gap"],["gave-up","gave-up"],["opened","gave-up"]],"title":"Working as designed is filed as a fault","why":"A hand-off the rules ask for looks the same as one caused by a fault, so Mike chases problems that aren't there.","seen":"At work: 425 of 1554 rule gaps name a hold the rules require (money, terms, a person decides). At the desk: 11 of 17 runs that did not end in a fix said the card was working as designed, already fixed, or a practice order.","root":"A ke that can go through the free lane."},{"id":"retry","graph":"work","tone":"crit","owner":"donna","highlight":[["model-error","model-error"]],"title":"A full model pool is retried, not avoided","why":"The planner retries a full model pool again and again instead of switching to the fallback.","seen":"324 model calls failed; 286 were “no room left” in the free model pool (HTTP 429). 30 cases retried 5 or more times in a row (longest 9). The fallback model was used 0 times.","root":"The planner retries the same pool while the pool is full, and the fallback path never fires, so a busy hour turns into a run of identical failures and then a rule gap that blames the message (“the planner model keeps failing on messages like this one”). That rule gap is the wrong lesson: the message was fine.","evidence":["model_error detail: pool \"tools\" has no deployment with room left","plan rows with fallback = true: 0","topic 5, question 4 (retry loops)"],"alone":"Backing off and switching to the fallback is a fix for a problem the rule already covers. It touches the model budget (the $1 a day setup), so the owner sees it before merge."},{"id":"queue","graph":"desk","tone":"warn","owner":"jessica","highlight":[["opened","never"],["gave-up","gave-up"],["pr","waiting"],["needs-person","waiting"]],"title":"Cards arrive faster than Mike works them, and none ever close","why":"Mike works one card per run, twice a day, and nothing closes a card when its problem stops.","seen":"9.2 cards a day open, 2.3 runs a day work them. Median wait for a first run: 3.8 days. 85 cards never worked, 17 waiting with a PR or a question. Cards retried after giving up twice: scout, hawkeye.","root":"The executor takes one card per run, twice a day, and nothing ever closes a card: the sweep refreshes cards but does not close them when the signal stops. A card that gave up comes back after 24 hours with the same brief, so Mike repeats the same search.","evidence":["agents/factory/README.md, step 6 (“not buil const day = (s) => s ? new Date(s).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }) : "—";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const NS = "http://www.w3.org/2000/svg";
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const KIND = {
  ok: { fill: "--ok-wash", stroke: "--ok", label: "Worked" },
  person: { fill: "--inset", stroke: "--line-strong", label: "Handed on by design" },
  held: { fill: "--warn-wash", stroke: "--warn", label: "Waits or gives up" },
  fail: { fill: "--crit-wash", stroke: "--crit", label: "Failed" },
  step: { fill: "--bg", stroke: "--line-strong", label: "Step" },
  edge: { fill: "--panel", stroke: "--muted", label: "Start or end" },
};
const MGR = { harvey: "Harvey", donna: "Donna", louis: "Louis", jessica: "Jessica" };
const edgeTone = (kind) => kind === "fail" ? "--crit" : kind === "held" ? "--warn" : "--edge";

// ---- Header ----
const T = DATA.totals;
$("#stats").innerHTML = [
  [fmt(T.cases), "cases with trouble"], [fmt(T.events), "steps logged"], [fmt(T.cards), "cards"], [fmt(T.runs), "runs by Mike"],
].map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join("");
if (DATA.silent) $("#silent").innerHTML = `<div class="alert"><b>Silent</b><span>The garden has logged no agent steps for ${DATA.silent.hours} hours (last one ${day(DATA.silent.since)}). The graphs below stop there. Check the garden before reading them as today's behaviour.</span></div>`;
$("#work-sub").textContent = `${day(DATA.window.firstEventAt)} – ${day(DATA.window.lastEventAt)} · 24 busiest lines`;
$("#desk-sub").textContent = `Cards since ${day(DATA.window.firstCardAt)} · built ${day(DATA.builtAt)}`;

// ---- Graph ----
const tip = $("#tip");
function showTip(ev, html) { tip.innerHTML = html; tip.hidden = false; tip.style.left = Math.min(ev.clientX + 12, innerWidth - 300) + "px"; tip.style.top = (ev.clientY + 12) + "px"; }
const hideTip = () => { tip.hidden = true; };

function el(name, attrs, parent) { const e = document.createElementNS(NS, name); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
function wrapLabel(s, max = 24) {
  const words = s.split(" "); const lines = [""];
  for (const w of words) { const l = lines[lines.length - 1]; if ((l + " " + w).trim().length > max && l) lines.push(w); else lines[lines.length - 1] = (l + " " + w).trim(); }
  return lines.slice(0, 2);
}
function smooth(pts) {
  if (pts.length < 3) return `M${pts[0].x},${pts[0].y} L${pts[pts.length - 1].x},${pts[pts.length - 1].y}`;
  let d = `M${pts[0].x},${pts[0].y}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
  }
  return d;
}

const views = {};
function draw(id, graph) {
  const svg = $("#g-" + id); svg.innerHTML = "";
  const g = new dagre.graphlib.Graph({ multigraph: false });
  g.setGraph({ rankdir: "LR", nodesep: 22, ranksep: 70, edgesep: 14, marginx: 24, marginy: 30 });
  g.setDefaultEdgeLabel(() => ({}));
  const byId = Object.fromEntries(graph.nodes.map((n) => [n.id, n]));
  for (const n of graph.nodes) { const lines = wrapLabel(n.label); g.setNode(n.id, { width: Math.max(...lines.map((l) => l.length)) * 7.2 + 34, height: 22 + lines.length * 16, lines }); }
  for (const e of graph.edges) if (e.from !== e.to) g.setEdge(e.from, e.to, { count: e.count });
  dagre.layout(g);
  const W = g.graph().width, H = g.graph().height + 20;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = "100%"; svg.style.height = "auto"; svg.style.maxWidth = `${Math.round(W * 1.15)}px`; svg.style.margin = "0 auto";
  const defs = el("defs", {}, svg);
  for (const t of ["--crit", "--warn", "--edge", "--accent"]) {
    const m = el("marker", { id: `ar-${id}${t}`, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 9, markerHeight: 9, markerUnits: "userSpaceOnUse", orient: "auto-start-reverse" }, defs);
    el("path", { d: "M0,0 L10,5 L0,10 z", fill: css(t) }, m);
  }
  const max = Math.max(...graph.edges.map((e) => e.count));
  const width = (c) => 1.5 + 7 * Math.sqrt(c / max);
  const outOf = {}; for (const e of graph.edges) outOf[e.from] = (outOf[e.from] || 0) + e.count;
  const labelled = new Set(graph.edges.slice().sort((a, b) => b.count - a.count).slice(0, 14).map((e) => e.from + ">" + e.to));
  const eLayer = el("g", {}, svg), nLayer = el("g", {}, svg);
  const edgeEls = [];
  for (const e of graph.edges) {
    const tone = edgeTone(byId[e.to].kind);
    const grp = el("g", { class: "e" }, eLayer); grp.dataset.k = e.from + ">" + e.to;
    let d, lx, ly;
    if (e.from === e.to) {
      const n = g.node(e.from); const x = n.x, y = n.y - n.height / 2;
      d = `M${x - 14},${y} C${x - 30},${y - 40} ${x + 30},${y - 40} ${x + 14},${y}`; lx = x; ly = y - 34;
    } else {
      const pts = g.edge(e.from, e.to).points; d = smooth(pts); const m = pts[Math.floor(pts.length / 2)]; lx = m.x; ly = m.y - 6;
    }
    el("path", { d, class: "hit" }, grp);
    el("path", { d, class: "line", stroke: css(tone), "stroke-width": width(e.count), "stroke-linecap": "round", "marker-end": `url(#ar-${id}${tone})` }, grp);
    if (labelled.has(grp.dataset.k) || e.from === e.to) { const t = el("text", { x: lx, y: ly, "text-anchor": "middle", fill: css(tone === "--edge" ? "--muted" : tone) }, grp); t.textContent = (e.from === e.to ? "×" : "") + fmt(e.count); }
    const pct = Math.round(100 * e.count / outOf[e.from]);
    grp.addEventListener("mousemove", (ev) => showTip(ev, `<b>${esc(byId[e.from].label)}</b> → <b>${esc(byId[e.to].label)}</b><br>${fmt(e.count)} times, ${pct}% of what follows the first step`));
    grp.addEventListener("mouseleave", hideTip);
    edgeEls.push({ e, grp });
  }
  const nodeEls = {};
  for (const n of graph.nodes) {
    const p = g.node(n.id), k = KIND[n.kind] || KIND.step;
    const grp = el("g", { class: "node", transform: `translate(${p.x - p.width / 2},${p.y - p.height / 2})`, tabindex: 0, role: "button", "aria-label": `${n.label}, ${n.cases} cases` }, nLayer);
    el("rect", { width: p.width, height: p.height, rx: 7, fill: css(k.fill), stroke: css(k.stroke) }, grp);
    let x = 12;
    if (n.owner) { el("circle", { cx: 14, cy: 15, r: 4.5, fill: css("--" + n.owner) }, grp); x = 24; }
    p.lines.forEach((l, i) => { const t = el("text", { x, y: 18 + i * 16, class: "t" }, grp); t.textContent = l; });
    const c = el("text", { x, y: 18 + p.lines.length * 16, class: "c" }, grp); c.textContent = `${fmt(n.cases)} ${id === "desk" ? "cards" : "cases"}`;
    const pick = () => select(id, n.id);
    grp.addEventListener("click", pick); grp.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } });
    nodeEls[n.id] = grp;
  }
  views[id] = { graph, byId, edgeEls, nodeEls };
  svg.addEventListener("click", (ev) => { if (!ev.target.closest(".node")) select(id, null); });
}

function clearMarks(v) { for (const { grp } of v.edgeEls) grp.classList.remove("dim", "hl"); for (const g of Object.values(v.nodeEls)) g.classList.remove("sel", "dim"); }
function select(id, nodeId) {
  const v = views[id]; clearMarks(v); document.querySelectorAll(".root").forEach((r) => r.setAttribute("aria-pressed", "false"));
  if (nodeId) {
    v.nodeEls[nodeId].classList.add("sel");
    for (const { e, grp } of v.edgeEls) if (e.from !== nodeId && e.to !== nodeId) grp.classList.add("dim");
  }
}
function highlight(id, pairs) {
  const v = views[id]; if (!v) return; clearMarks(v);
  const keys = new Set(pairs.map(([a, b]) => a + ">" + b));
  const nodes = new Set(pairs.flat());
  for (const { grp } of v.edgeEls) grp.classList.add(keys.has(grp.dataset.k) ? "hl" : "dim");
  for (const [k, g] of Object.entries(v.nodeEls)) if (!nodes.has(k)) g.classList.add("dim");
}

function foot(id) {
  const kinds = id === "desk" ? ["ok", "person", "held", "fail"] : ["ok", "person", "held", "fail", "step"];
  $("#foot-" + id).innerHTML = kinds.map((k) => `<span><i class="box" style="background:var(${KIND[k].fill});border-color:var(${KIND[k].stroke})"></i>${KIND[k].label}</span>`).join("")
    + (id === "work" ? Object.entries(MGR).map(([k, l]) => `<span><i class="sw" style="background:var(--${k})"></i>${l}</span>`).join("") : "")
    + `<span class="hint">Click a step to isolate its lines · ×n = repeated</span>`;
}

draw("work", DATA.work); foot("work");
let mgr = "all";
function drawDesk() {
  $("#mgr").innerHTML = ["all", "harvey", "donna", "louis", "jessica"].map((m) => `<button type="button" aria-pressed="${m === mgr}" data-m="${m}">${m === "all" ? "All" : `<i class="sw" style="background:var(--${m})"></i>${MGR[m]}`}</button>`).join("");
  $("#mgr").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { mgr = b.dataset.m; drawDesk(); }));
  const g = DATA.desk[mgr];
  if (!g.nodes.length) { $("#g-desk").innerHTML = ""; $("#desk-sub").textContent = `No cards for ${MGR[mgr]} yet.`; return; }
  draw("desk", g);
}
drawDesk(); foot("desk");

// ---- Roots ----
$("#roots").innerHTML = DATA.roots.map((r) => `<button type="button" class="root" id="root-${r.id}" data-r="${r.id}" aria-pressed="false">
  <span class="rhead"><span class="pill ${r.tone}">${r.tone === "crit" ? "Costs cases" : "Wastes work"}</span><span class="who"><i class="sw" style="background:var(--${r.owner})"></i>${MGR[r.owner]}</span></span>
  <h3>${esc(r.title)}</h3>
  <span class="why">${esc(r.why)}</span>
  <span class="seen">${esc(r.seen)}</span></button>`).join("");
document.querySelectorAll(".root").forEach((b) => b.addEventListener("click", () => {
  const r = DATA.roots.find((x) => x.id === b.dataset.r);
  document.querySelectorAll(".root").forEach((a) => a.setAttribute("aria-pressed", String(a.id === "root-" + r.id)));
  if (r.graph !== "desk") highlight("work", r.highlight);
  if (r.graph !== "work") { if (mgr !== "all") { mgr = "all"; drawDesk(); } highlight("desk", r.highlight); }
  $("#" + (r.graph === "desk" ? "desk" : "work")).scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}));
</script>
